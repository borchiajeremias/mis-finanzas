<style>

<style>

<main><div class="nav" id="nav"><button onclick="mv(-1)" aria-label="Mes anterior">‹</button><h1 id="mes"></h1><button onclick="mv(1)" aria-label="Mes siguiente">›</button></div><div id="c"></div></main>
<button class="fab" onclick="openF(null,'out')" aria-label="Registrar movimiento">+</button>

<script>
const $=id=>document.getElementById(id),K='finanzas_v2';
const G={Fijos:['Alquiler','Servicios','Internet','Seguros'],Variables:['Comida','Transporte','Farmacia'],Personales:['Ropa','Ocio','Suscripciones'],Financieros:['Cuotas','Intereses','Comisiones'],Ahorro:['Ahorro'],Otros:['Otros gastos']};
const EXP=Object.values(G).flat(),INC=['Sueldo','Independiente','Ventas','Intereses ganados','Otros ingresos'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td=()=>iso(new Date()),addM=(m,n)=>iso(new Date(+m.slice(0,4),+m.slice(5)-1+n,1)).slice(0,7);
const fm=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let N=Date.now();const nid=()=>++N;
let S={acc:[],tx:[],bud:{},rec:[]},M=td().slice(0,7),v=0,FL={q:'',c:'',a:''},TT,FT='out',FE=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
if(!S.acc.length)S.acc.push({id:nid(),name:'Efectivo',kind:'cash',b0:0});
try{const o=JSON.parse(localStorage.getItem('finanzas_v1')||'[]');if(o.length&&!S.mig){const a0=S.acc[0].id,CM={Vivienda:'Alquiler',Salud:'Farmacia','Deudas/Tarjeta':'Cuotas',Otros:'Otros gastos',Extra:'Otros ingresos'},nw=td().slice(0,7);
o.forEach(i=>{let c=CM[i.cat]||i.cat;if(i.type=='in'&&!INC.includes(c))c='Otros ingresos';if(i.type=='out'&&!EXP.includes(c))c='Otros gastos';const b={type:i.type,amount:i.amount,cat:c,acc:a0,desc:i.name,tags:[]};
if(i.fixed){const r={id:nid(),...b,f:'m',start:i.month+'-01',paid:{}};for(let m=i.month;m<=nw;m=addM(m,1)){S.tx.push({...b,id:nid(),date:m+'-01'});r.paid[m+'-01']=1}S.rec.push(r)}else S.tx.push({...b,id:nid(),date:i.month+'-01'})});S.mig=1;save()}}catch(e){}
const bal=a=>a.b0+S.tx.reduce((s,t)=>s+(t.acc==a.id?(t.type=='in'?t.amount:-t.amount):0)+(t.type=='tr'&&t.to==a.id?t.amount:0),0);
const mt=m=>{let i=0,o=0;S.tx.forEach(t=>{if(t.date.slice(0,7)==m){if(t.type=='in')i+=t.amount;else if(t.type=='out')o+=t.amount}});return{i,o}};
const bycat=m=>{const r={};S.tx.forEach(t=>{if(t.type=='out'&&t.date.slice(0,7)==m)r[t.cat]=(r[t.cat]||0)+t.amount});return r};
const an=id=>{const a=S.acc.find(x=>x.id==id);return a?esc(a.name):'?'};
const accO=()=>S.acc.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
const dl=(a,b,bad)=>b==0?(a>0?'nuevo':'—'):`<b class="${(a>b)==bad?'out':'in'}">${a>=b?'↑':'↓'} ${Math.abs(Math.round((a-b)/b*100))}%</b>`;
function occ(r,a,b){const s=new Date(r.start+'T12:00'),o=[];for(let k=0;k<700;k++){let d;if(r.f=='w')d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7*k);else if(r.f=='y')d=new Date(s.getFullYear()+k,s.getMonth(),s.getDate());else{const dim=new Date(s.getFullYear(),s.getMonth()+k+1,0).getDate();d=new Date(s.getFullYear(),s.getMonth()+k,Math.min(s.getDate(),dim))}const x=iso(d);if(x>b)break;if(x>=a)o.push(x)}return o}
const pend=n=>{const a=iso(new Date(Date.now()-30*864e5)),b=iso(new Date(Date.now()+n*864e5)),o=[];S.rec.forEach(r=>occ(r,a,b).forEach(d=>{if(!r.paid[d])o.push({r,d})}));return o.sort((x,y)=>x.d<y.d?-1:1)};
const pr=p=>`<div class="it"><div class="t"><div>${esc(p.r.desc)}</div><small>${p.d.slice(8)}/${p.d.slice(5,7)}${p.d<td()?' · ⚠️ vencido':''} · ${an(p.r.acc)}</small></div><b class="${p.r.type}">${fm(p.r.amount)}</b><button class="pay" onclick="payR(${p.r.id},'${p.d}')">${p.r.type=='in'?'Cobrado':'Pagado'}</button></div>`;
function payR(id,d){const r=S.rec.find(x=>x.id==id);S.tx.push({id:nid(),type:r.type,amount:r.amount,date:td(),cat:r.cat,acc:r.acc,desc:r.desc,tags:[]});r.paid[d]=1;save();render()}
const SC=`<svg viewBox="0 0 400 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--s1)"/><stop offset="1" style="stop-color:var(--s2)"/></linearGradient><radialGradient id="gl"><stop offset="0" style="stop-color:var(--sun);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient></defs><rect width="400" height="170" fill="url(#sk)"/><circle cx="330" cy="46" r="62" fill="url(#gl)"/><circle cx="330" cy="46" r="17" fill="var(--sun)"/><g class="ff" fill="var(--sun)"><circle cx="40" cy="30" r="1.6"/><circle cx="120" cy="22" r="1.4"/><circle cx="205" cy="38" r="1.7"/><circle cx="265" cy="16" r="1.4"/><circle cx="75" cy="62" r="1.3"/><circle cx="170" cy="58" r="1.5"/><circle cx="380" cy="20" r="1.4"/></g><path d="M0 112 L48 74 L92 102 L142 64 L202 108 L252 78 L312 106 L362 82 L400 100 V170 H0Z" fill="var(--m)"/><g class="cl" fill="var(--cl)" opacity=".9"><ellipse cx="92" cy="86" rx="32" ry="9"/><ellipse cx="112" cy="78" rx="22" ry="9"/><ellipse cx="80" cy="79" rx="16" ry="7"/><ellipse cx="236" cy="56" rx="28" ry="8"/><ellipse cx="256" cy="49" rx="19" ry="8"/><ellipse cx="368" cy="92" rx="22" ry="6"/></g><path d="M150 38 q6 -8 12 0 q6 -8 12 0 M184 50 q5 -6 10 0 q5 -6 10 0" stroke="var(--gt)" fill="none" stroke-width="1.6" stroke-linecap="round"/><path d="M0 122 Q80 86 170 114 T310 104 T400 110 V170 H0Z" fill="var(--h1)"/><g fill="var(--h3)"><path d="M120 116 l7 -24 l7 24z"/><path d="M132 118 l6 -20 l6 20z"/><path d="M336 108 l6 -20 l6 20z"/></g><path d="M0 142 Q110 110 230 138 T400 126 V170 H0Z" fill="var(--h2)"/><path d="M285 96 q-7 -7 0 -13 q7 -6 0 -13" stroke="var(--cl)" fill="none" stroke-width="3" stroke-linecap="round" opacity=".6"/><rect x="255" y="110" width="34" height="25" fill="#f6e7c8"/><rect x="281" y="94" width="6" height="14" fill="#b9694c"/><path d="M249 111 L272 90 L295 111Z" fill="var(--out)"/><rect x="260" y="118" width="9" height="9" rx="1" fill="var(--win)"/><rect x="276" y="120" width="8" height="15" rx="2" fill="#8a5a3b"/><rect x="39" y="128" width="7" height="26" fill="#7a5a3b"/><circle cx="43" cy="118" r="17" fill="var(--h3)"/><circle cx="33" cy="127" r="11" fill="var(--h2)"/><circle cx="52" cy="124" r="10" fill="var(--h3)"/><circle cx="40" cy="112" r="8" fill="var(--h1)" opacity=".5"/><path d="M280 136 Q262 148 304 160 T356 170" stroke="#f0dfb4" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/><path d="M0 157 Q120 136 240 154 T400 148 V170 H0Z" fill="var(--h3)"/><g><circle cx="60" cy="160" r="2.2" fill="#f4a6b8"/><circle cx="96" cy="164" r="2.2" fill="#ffd36e"/><circle cx="142" cy="158" r="2.2" fill="#fff"/><circle cx="188" cy="162" r="2.2" fill="#f4a6b8"/><circle cx="224" cy="160" r="2.2" fill="#ffd36e"/><circle cx="332" cy="156" r="2.2" fill="#fff"/><circle cx="376" cy="160" r="2.2" fill="#f4a6b8"/><path d="M18 164 l2 -7 m3 7 l1 -6 M206 166 l2 -7 m3 7 l1 -6" stroke="var(--h1)" stroke-width="1.5" stroke-linecap="round"/></g></svg>`;
const ART=`<div class="sky">${SC}<div class="gr">Hola Ali, ¿qué vas a hacer hoy?</div></div>`;
const banner=()=>`<div class="sky sm">${SC}<div class="gr sm">${['','Mis movimientos','Mi presupuesto','Mis cuentas','Mis pagos'][v]}</div></div>`;
let CR='7';const setCR=x=>{CR=x;render()};
function chart(){const bars=[];
if(CR=='6'){for(let i=5;i>=0;i--){const m=addM(M,-i),x=mt(m);bars.push({i:x.i,o:x.o,l:new Date(m+'-15').toLocaleDateString('es-AR',{month:'short'}).replace('.','')})}}
else{const n=+CR,now=new Date(),dd={};S.tx.forEach(t=>{if(t.type!='tr'){const o=dd[t.date]||(dd[t.date]={i:0,o:0});if(t.type=='in')o.i+=t.amount;else o.o+=t.amount}});
for(let k=n-1;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-k),x=dd[iso(d)]||{i:0,o:0};bars.push({i:x.i,o:x.o,l:n==7?d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','').slice(0,3):(k%5==0?d.getDate():'')})}}
const mx=Math.max(1,...bars.flatMap(b=>[b.i,b.o])),w=300/bars.length,bw=w*.38,ti=bars.reduce((a,b)=>a+b.i,0),to=bars.reduce((a,b)=>a+b.o,0);
return '<svg viewBox="0 0 300 125" width="100%"><line x1="0" x2="300" y1="100" y2="100" stroke="var(--bd)"/>'+bars.map((b,j)=>{const X=j*w+w*.1,h1=b.i/mx*90,h2=b.o/mx*90;return `<rect x="${X}" y="${100-h1}" width="${bw}" height="${h1}" rx="${Math.min(3,bw/2)}" fill="var(--in)"/><rect x="${X+bw+1}" y="${100-h2}" width="${bw}" height="${h2}" rx="${Math.min(3,bw/2)}" fill="var(--out)"/><text x="${X+bw}" y="115" font-size="9" text-anchor="middle" fill="var(--mut)">${b.l}</text>`}).join('')+`</svg><div class="bh" style="margin-top:6px"><span class="in">Ingresos ${fm(ti)}</span><span class="out">Gastos ${fm(to)}</span></div>`}
const V=[];
V[0]=()=>{const c=mt(M),q=mt(addM(M,-1)),b=c.i-c.o,cats=bycat(M),tot=c.o,
disp=S.acc.filter(a=>a.kind!='credit').reduce((s,a)=>s+bal(a),0),debt=S.acc.filter(a=>a.kind=='credit').reduce((s,a)=>s+Math.min(0,bal(a)),0),
st=!c.i&&!c.o?'Todavía no registraste movimientos este mes':c.o>c.i?`⚠️ Gastaste ${fm(c.o-c.i)} más de lo que ganaste`:`✅ Gastaste el ${Math.round(c.o/c.i*100)}% de tus ingresos`,al=[];
EXP.forEach(k=>{const l=S.bud[k];if(l>0){const p=(cats[k]||0)/l;if(p>=.7)al.push(`<div class="al ${p>=1?'r':''}">${p>=1?'🚨 Presupuesto excedido':p>=.9?'⚠️ Más del 90%':'⚠️ Más del 70%'} en <b>${k}</b>: ${fm(cats[k])} de ${fm(l)}</div>`)}});
const ov=pend(0).filter(p=>p.d<td()).length;if(ov)al.push(`<div class="al r">⏰ Tenés ${ov} pago(s) vencido(s) sin marcar</div>`);
const up=pend(14).slice(0,5),top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);
return `${ART}<div class="card hero"><small>Saldo del mes</small><div class="n ${b>=0?'in':'out'}">${fm(b)}</div><p>${st}</p>
<div class="row3"><div>Ingresos<b class="in">${fm(c.i)}</b></div><div>Gastos<b class="out">${fm(c.o)}</b></div></div>
<div class="row3"><div>Disponible hoy<b>${fm(disp)}</b></div><div>Deuda tarjetas<b class="${debt<0?'out':''}">${fm(-debt)}</b></div></div></div>
<div class="bk" style="margin-bottom:12px"><button class="add" onclick="openF(null,'out')">− Gasto</button><button class="add" onclick="openF(null,'in')">+ Ingreso</button><button onclick="openF(null,'tr')">⇄ Transferir</button></div>
${al.length?`<div class="card"><h2>Alertas</h2>${al.join('')}</div>`:''}
<div class="card"><h2>Vs. mes anterior</h2><div class="bh"><span>Gastos</span><span>${dl(c.o,q.o,1)} <span class="mut">(${fm(q.o)})</span></span></div><div class="bh" style="margin-top:6px"><span>Ingresos</span><span>${dl(c.i,q.i,0)} <span class="mut">(${fm(q.i)})</span></span></div></div>
<div class="card"><h2>Próximos pagos (14 días)</h2>${up.length?up.map(pr).join(''):'<div class="empty">Nada por vencer. Programalos en Pagos.</div>'}</div>
<div class="card"><h2>Evolución <span class="in">■ ingresos</span> <span class="out">■ gastos</span></h2><div class="seg" style="margin:8px 0">${[['7','7 días'],['30','30 días'],['6','6 meses']].map(([k,l])=>`<button class="${CR==k?'on':''}" onclick="setCR('${k}')">${l}</button>`).join('')}</div>${chart()}</div>
<div class="card"><h2>Gastos por categoría</h2>${top.length?top.map(([k,x])=>`<div class="bd" style="margin-bottom:8px"><div class="bh"><span>${k}</span><span>${fm(x)} · ${Math.round(x/tot*100)}%</span></div><div class="bar"><i style="width:${x/tot*100}%;background:var(--ac)"></i></div></div>`).join(''):'<div class="empty">Sin gastos este mes</div>'}</div>`};
V[1]=()=>{FL={q:'',c:'',a:''};return `<div class="card"><input id="q" style="margin:0" placeholder="🔍 Buscar por descripción, categoría o etiqueta" oninput="FL.q=this.value;rl()"><div class="bk"><select onchange="FL.c=this.value;rl()"><option value="">Todas las categorías</option>${[...EXP,...INC].map(c=>`<option>${c}</option>`).join('')}</select><select onchange="FL.a=this.value;rl()"><option value="">Todas las cuentas</option>${accO()}</select></div></div><div class="card" id="ml"></div>`};
const row=t=>{const cr=t.type=='tr'&&(S.acc.find(a=>a.id==t.to)||{}).kind=='credit';return `<div class="it"><div class="t"><div>${esc(t.desc||(t.type=='tr'?(cr?'Pago de tarjeta':'Transferencia'):t.cat))}</div><small>${t.date.slice(8)}/${t.date.slice(5,7)} · ${t.type=='tr'?an(t.acc)+' → '+an(t.to):esc(t.cat)+(t.sub?' / '+esc(t.sub):'')+' · '+an(t.acc)}${(t.tags||[]).map(g=>' #'+esc(g)).join('')}</small></div><b class="${t.type=='tr'?'':t.type}">${t.type=='out'?'-':''}${fm(t.amount)}</b><button onclick="openF(${t.id})" aria-label="Editar">✎</button><button onclick="dup(${t.id})" aria-label="Duplicar">⧉</button><button onclick="del(${t.id})" aria-label="Eliminar">✕</button></div>`};
function rl(){const q=FL.q.toLowerCase(),l=S.tx.filter(t=>t.date.slice(0,7)==M&&(!FL.c||t.cat==FL.c)&&(!FL.a||t.acc==FL.a||t.to==FL.a)&&(!q||(t.desc+' '+(t.sub||'')+' '+(t.cat||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('ml').innerHTML=l.length?l.map(row).join(''):'<div class="empty">Sin movimientos</div>'}
V[2]=()=>{const b=bycat(M);return `<div class="card"><h2>Presupuesto mensual: previsto vs. real</h2>${EXP.map(c=>{const s=b[c]||0,l=S.bud[c]||0,p=l?s/l:0;return `<div class="bd"><div class="bh"><span>${c}</span><span>${fm(s)}${l?' / '+fm(l):''}</span></div>${l?`<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${p>=1?'var(--out)':p>=.9?'#f59e0b':p>=.7?'#eab308':'var(--in)'}"></i></div>`:''}<input type="number" inputmode="decimal" placeholder="Límite mensual" value="${l||''}" onchange="sb('${c}',this.value)"></div>`}).join('')}</div>`};
const sb=(c,x)=>{S.bud[c]=parseFloat(x)||0;save();render()};
const KL={bank:'Cuenta bancaria',cash:'Efectivo',credit:'Tarjeta de crédito'};
V[3]=()=>`<div class="card"><h2>Mis cuentas</h2>${S.acc.map(a=>{const x=bal(a);return `<div class="it"><div class="t"><div>${esc(a.name)}</div><small>${KL[a.kind]}${a.kind=='credit'&&x<0?' · deuda':''}</small></div><b class="${x<0?'out':''}">${fm(x)}</b><button onclick="da(${a.id})" aria-label="Borrar cuenta">✕</button></div>`}).join('')}
<button class="bk add" style="width:100%;margin-top:10px;padding:12px;border-radius:10px" onclick="openF(null,'tr')">⇄ Transferir / pagar tarjeta</button></div>
<div class="card"><h2>Agregar cuenta</h2><input id="an" placeholder="Nombre (ej: Banco Nación, Visa)"><select id="ak"><option value="bank">Cuenta bancaria</option><option value="cash">Efectivo</option><option value="credit">Tarjeta de crédito</option></select><input id="ab" type="number" inputmode="decimal" placeholder="Saldo inicial (deuda actual en negativo)"><button class="bk add" style="width:100%;margin-top:10px;padding:12px;border-radius:10px" onclick="aa()">Agregar</button></div>
<div class="card"><h2>Copia de seguridad</h2><textarea id="bt" style="display:none;width:100%;height:90px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;margin-bottom:8px"></textarea><div class="bk"><button onclick="exp()">Copiar datos</button><button onclick="imp()">Restaurar</button></div></div>`;
function aa(){const n=$('an').value.trim();if(!n)return;S.acc.push({id:nid(),name:n,kind:$('ak').value,b0:parseFloat($('ab').value)||0});save();render()}
function da(id){if(S.tx.some(t=>t.acc==id||t.to==id)||S.rec.some(r=>r.acc==id))return alert('La cuenta tiene movimientos. Eliminá o editá esos movimientos primero.');if(S.acc.length<2)return alert('Tiene que quedar al menos una cuenta.');S.acc=S.acc.filter(a=>a.id!=id);save();render()}
function exp(){const t=$('bt');t.style.display='block';t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function imp(){const t=$('bt');if(t.style.display=='none'){t.style.display='block';t.value='';t.placeholder='Pegá tus datos y tocá Restaurar de nuevo';return}try{const x=JSON.parse(t.value);if(x.acc&&x.tx&&confirm('Esto reemplaza los datos actuales. ¿Seguro?')){S=Object.assign({acc:[],tx:[],bud:{},rec:[]},x);save();render()}}catch(e){alert('Datos inválidos')}}
V[4]=()=>{const p=pend(60),p30=pend(30),disp=S.acc.filter(a=>a.kind!='credit').reduce((s,a)=>s+bal(a),0),net=p30.reduce((s,x)=>s+(x.r.type=='in'?x.r.amount:-x.r.amount),0);
return `<div class="card"><h2>Proyección a 30 días</h2><div class="bh"><span>Disponible hoy</span><b>${fm(disp)}</b></div><div class="bh"><span>Pagos e ingresos programados</span><b class="${net<0?'out':'in'}">${fm(net)}</b></div><div class="bh"><span>Quedaría</span><b class="${disp+net<0?'out':''}">${fm(disp+net)}</b></div></div>
<div class="card"><h2>Próximos vencimientos (60 días)</h2>${p.length?p.map(pr).join(''):'<div class="empty">Sin pagos programados</div>'}</div>
<div class="card"><h2>Programar pago o ingreso recurrente</h2><input id="rd" placeholder="Concepto (ej: Alquiler, Sueldo, Netflix)"><input id="ra" type="number" inputmode="decimal" placeholder="Importe"><select id="rc"><optgroup label="Gasto">${EXP.map(c=>`<option>${c}</option>`).join('')}</optgroup><optgroup label="Ingreso">${INC.map(c=>`<option>${c}</option>`).join('')}</optgroup></select><select id="rac">${accO()}</select><select id="rf"><option value="m">Todos los meses</option><option value="w">Todas las semanas</option><option value="y">Todos los años</option></select><label class="l">Primer vencimiento</label><input id="rs" type="date" value="${td()}"><button class="bk add" style="width:100%;margin-top:10px;padding:12px;border-radius:10px" onclick="ar()">Programar</button></div>
<div class="card"><h2>Reglas activas</h2>${S.rec.length?S.rec.map(r=>`<div class="it"><div class="t"><div>${esc(r.desc)}</div><small>${{m:'Mensual',w:'Semanal',y:'Anual'}[r.f]} · desde ${r.start.slice(8)}/${r.start.slice(5,7)} · ${esc(r.cat)}</small></div><b class="${r.type}">${fm(r.amount)}</b><button onclick="dr(${r.id})" aria-label="Borrar">✕</button></div>`).join(''):'<div class="empty">Ninguna</div>'}</div>`};
function ar(){const a=parseFloat($('ra').value),d=$('rd').value.trim();if(!(a>0)||!d)return alert('Completá concepto e importe');const c=$('rc').value;S.rec.push({id:nid(),type:INC.includes(c)?'in':'out',amount:a,cat:c,acc:+$('rac').value,desc:d,f:$('rf').value,start:$('rs').value||td(),paid:{}});save();render()}
function dr(id){if(confirm('¿Eliminar esta regla? Los movimientos ya registrados se conservan.')){S.rec=S.rec.filter(r=>r.id!=id);save();render()}}
function setFT(t){FT=t;[...$('tyb').children].forEach(b=>b.className=b.dataset.t==t?'on':'');const tr=t=='tr';$('fc').style.display=$('fs').style.display=$('lc').style.display=tr?'none':'';$('fto').style.display=$('lto').style.display=tr?'':'none';$('lac').textContent=tr?'Desde':'Cuenta / medio de pago';if(!tr)$('fc').innerHTML=(t=='in'?INC:EXP).map(c=>`<option>${c}</option>`).join('')}
function openF(id,t,cp){FE=id||null;const x=id?S.tx.find(i=>i.id==id):cp;$('fac').innerHTML=accO();$('fto').innerHTML=accO();setFT(x?x.type:t||'out');
if(x){$('fa').value=x.amount;$('fd').value=x.date;if(x.cat)$('fc').value=x.cat;$('fs').value=x.sub||'';$('fac').value=x.acc;$('fto').value=x.to||x.acc;$('fde').value=x.desc||'';$('fg').value=(x.tags||[]).join(', ')}
else{$('fa').value='';$('fd').value=td();$('fs').value=$('fde').value=$('fg').value=''}
$('sht').textContent=id?'Editar movimiento':'Nuevo movimiento';$('sh').style.display='flex';$('fa').focus()}
const cl=()=>$('sh').style.display='none';
function sv(){const a=parseFloat($('fa').value);if(!(a>0))return alert('Ingresá un importe mayor a 0');
const t={id:FE||nid(),type:FT,amount:a,date:$('fd').value||td(),acc:+$('fac').value,desc:$('fde').value.trim(),tags:$('fg').value.split(',').map(s=>s.trim()).filter(Boolean)};
if(FT=='tr'){t.to=+$('fto').value;if(t.to==t.acc)return alert('Elegí cuentas distintas')}else{t.cat=$('fc').value;t.sub=$('fs').value.trim()}
if(!FE&&S.tx.some(x=>x.type==t.type&&x.amount==t.amount&&x.date==t.date&&x.acc==t.acc&&x.desc==t.desc)&&!confirm('Ya existe un movimiento igual. ¿Guardarlo igual?'))return;
if(FE)S.tx=S.tx.map(x=>x.id==FE?t:x);else{S.tx.push(t);M=t.date.slice(0,7)}save();cl();render()}
const dup=id=>openF(null,null,{...S.tx.find(x=>x.id==id),date:td()});
function del(id){const t=S.tx.find(x=>x.id==id);S.tx=S.tx.filter(x=>x.id!=id);save();render();toast('Movimiento eliminado',()=>{S.tx.push(t);save();render()})}
function toast(m,f){const e=$('ts');e.innerHTML='<span>'+m+'</span>'+(f?'<button id="ub">Deshacer</button>':'');e.style.display='flex';if(f)$('ub').onclick=()=>{f();e.style.display='none'};clearTimeout(TT);TT=setTimeout(()=>e.style.display='none',6000)}
const mv=n=>{M=addM(M,n);render()},go=i=>{v=i;scrollTo(0,0);render()};
function render(){document.querySelectorAll('.tb button').forEach((b,i)=>b.className=i==v?'on':'');$('nav').style.display=v<3?'flex':'none';$('mes').textContent=new Date(M+'-15').toLocaleDateString('es-AR',{month:'long',year:'numeric'});$('c').innerHTML=(v?banner():'')+V[v]();if(v==1)rl()}
render();
</script></body></html>
